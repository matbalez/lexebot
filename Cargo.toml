[package]
name = "lexebot"
version = "0.1.8"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
futures-util = "0.3"
lexe = "0.1"
nostr = { version = "0.36", features = ["nip44"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"
